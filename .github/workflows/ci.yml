name: Server CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run --pool=vmThreads --maxWorkers=1
      - run: docker build -f Dockerfile.prod -t white-caves-server:ci .
